name: Tests — full suite

# Runs the complete test suite (tms_settlement golden + virtual_sap dry-run).
# Complements ci.yml, which only runs the tms_settlement golden tests and the
# harness/_core coverage gate. This workflow ensures every suite under tests/
# is collected and executed — including virtual_sap, which ci.yml omits.

on:
  push:
    paths:
      - 'harness/**'
      - 'utils/**'
      - 'scm_mcp/**'
      - 'tests/**'
      - 'requirements-*.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'harness/**'
      - 'utils/**'
      - 'scm_mcp/**'
      - 'tests/**'
      - 'requirements-*.txt'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (full suite)
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # harness/_core + tms_settlement runtime deps
          pip install -r harness/requirements.txt
          # virtual_sap deps (supabase client is imported at collection time)
          pip install -r requirements-virtual-sap.txt
          pip install pytest pytest-cov

      - name: Run full test suite
        run: |
          python -m pytest tests/ -v --tb=short
