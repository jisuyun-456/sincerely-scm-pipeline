name: Wave Recommender

on:
  schedule:
    # KST 09:00 / 14:00 / 17:00 영업일 (UTC 00:00 / 05:00 / 08:00)
    - cron: '0 0 * * 1-5'
    - cron: '0 5 * * 1-5'
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no Airtable PATCH)'
        required: false
        default: 'false'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download snapshot
        uses: actions/download-artifact@v4
        with:
          name: dispatch-snapshot
          path: /tmp/snapshot
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run wave recommender
        run: python -m harness.dispatch.wave_recommender
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_USER_ID: ${{ secrets.SLACK_DM_USER_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SNAPSHOT_PATH: /tmp/snapshot/dispatch_snapshot.json

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispatch-snapshot
          path: /tmp/snapshot/dispatch_snapshot.json
          retention-days: 90
          overwrite: true
